mp.messaging.incoming.signals.connector=smallrye-kafka
mp.messaging.incoming.signals.value.deserializer=fr.simplex_software.workshop.reactive_messaging.kafka.logger.PriceSignalDeserializer
mp.messaging.incoming.signals.auto.offset.reset=earliest
mp.messaging.incoming.signals.fail-on-deserialization-failure=false
mp.messaging.incoming.signals.failure-strategy=ignore

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

quarkus.kubernetes.deployment-target=minikube
quarkus.container-image.group=nicolasduminil
quarkus.kubernetes.node-port=30083
quarkus.kubernetes.env.vars.kafka-bootstrap-servers=finhub-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
