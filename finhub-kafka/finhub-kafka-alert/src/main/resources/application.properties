mp.messaging.incoming.signals.connector=smallrye-kafka
mp.messaging.incoming.signals.value.deserializer=fr.simplex_software.workshop.reactive_messaging.kafka.alert.PriceSignalDeserializer
mp.messaging.incoming.signals.auto.offset.reset=earliest
mp.messaging.incoming.signals.fail-on-deserialization-failure=false
mp.messaging.incoming.signals.failure-strategy=dead-letter-queue
mp.messaging.incoming.signals.dead-letter-queue.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

smallrye.messaging.worker.alerts.max-concurrency=${ALERT_MAX_CONCURRENCY:32}
quarkus.rest-client.alert.connection-pool-size=${ALERT_POOL:${ALERT_MAX_CONCURRENCY:32}}
quarkus.rest-client.alert.url=${ALERT_URL:http://localhost:9000/alerts}
quarkus.rest-client.alert.read-timeout=5000

%test.quarkus.rest-client.alert.connection-pool-size=${ALERT_POOL:4096}

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

quarkus.kubernetes.deployment-target=minikube
quarkus.container-image.group=nicolasduminil
quarkus.kubernetes.node-port=30084
quarkus.kubernetes.env.vars.kafka-bootstrap-servers=finhub-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
