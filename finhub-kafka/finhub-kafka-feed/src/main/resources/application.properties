quarkus.rest-client.finnhub.url=https://finnhub.io/api/v1
finnhub.token=${FINNHUB_TOKEN:}
finnhub.symbol=${FINNHUB_SYMBOL:AAPL}
finnhub.interval-seconds=${FINNHUB_INTERVAL:15}

mp.messaging.outgoing.quotes.connector=smallrye-kafka
mp.messaging.outgoing.quotes.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

quarkus.kubernetes.deployment-target=minikube
quarkus.container-image.group=nicolasduminil

quarkus.kubernetes.node-port=30081

quarkus.kubernetes.env.vars.kafka-bootstrap-servers=finhub-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092

quarkus.kubernetes.env.secrets=finnhub
