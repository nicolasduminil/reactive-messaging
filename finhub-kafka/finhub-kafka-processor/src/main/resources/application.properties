mp.messaging.incoming.quotes.connector=smallrye-kafka
mp.messaging.incoming.quotes.value.deserializer=fr.simplex_software.workshop.reactive_messaging.kafka.processor.QuoteDeserializer
mp.messaging.incoming.quotes.auto.offset.reset=earliest
mp.messaging.incoming.quotes.fail-on-deserialization-failure=false
mp.messaging.incoming.quotes.failure-strategy=ignore

mp.messaging.outgoing.signals.connector=smallrye-kafka
mp.messaging.outgoing.signals.value.serializer=io.quarkus.kafka.client.serialization.JsonbSerializer

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

quarkus.kubernetes.deployment-target=minikube
quarkus.container-image.group=nicolasduminil
quarkus.kubernetes.node-port=30082
quarkus.kubernetes.env.vars.kafka-bootstrap-servers=finhub-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
