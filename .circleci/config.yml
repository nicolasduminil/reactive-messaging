version: 2.1

jobs:
  build:
    # The Kafka modules use Dev Services, i.e. Testcontainers, so the job needs a real Docker
    # daemon. A machine executor provides one; the plain docker executor does not.
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install JDK 21 and Maven
          command: |
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk maven
            echo 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$BASH_ENV"
      - run:
          name: Hash every POM into one cache key
          command: find . -name pom.xml -exec cat {} + | sha256sum | cut -d' ' -f1 > /tmp/poms.hash
      - restore_cache:
          keys:
            - m2-{{ checksum "/tmp/poms.hash" }}
            - m2-
      - run:
          name: Build and test
          command: mvn -B -ntp verify
      - save_cache:
          key: m2-{{ checksum "/tmp/poms.hash" }}
          paths:
            - ~/.m2/repository
      - run:
          name: Collect test reports
          when: always
          command: |
            mkdir -p /tmp/test-results
            find . -path "*/target/*-reports/*.xml" -exec cp {} /tmp/test-results/ \;
      - store_test_results:
          path: /tmp/test-results

workflows:
  ci:
    jobs:
      - build
